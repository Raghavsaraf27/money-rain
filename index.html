<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Raining Money Widget</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    /* Transparent background to blend into Notion dark mode */
    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
    }

    /* Canvas covers full iframe area */
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <canvas id="moneyCanvas"></canvas>

  <script>
    const canvas = document.getElementById('moneyCanvas');
    const ctx = canvas.getContext('2d');

    // Resize canvas automatically to fit embed container
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Particle Configuration
    const particleCount = 35;
    const particles = [];

    class MoneyParticle {
      constructor() {
        this.reset(true);
      }

      reset(initial = false) {
        this.x = Math.random() * canvas.width;
        // Start above screen
        this.y = initial ? Math.random() * canvas.height : -50;
        this.size = Math.random() * 12 + 16; // Random size
        this.speedY = Math.random() * 1.5 + 1; // Falling speed
        this.speedX = Math.sin(Math.random() * Math.PI) * 0.5; // Slight drift
        this.type = Math.random() > 0.4 ? 'coin' : 'dollar'; // 60% coins, 40% dollars
        this.rotation = Math.random() * Math.PI * 2;
        this.rotationSpeed = (Math.random() - 0.5) * 0.03;
        this.opacity = Math.random() * 0.4 + 0.6;
      }

      update() {
        this.y += this.speedY;
        this.x += Math.sin(this.y * 0.02) * 0.5; // Natural sway
        this.rotation += this.rotationSpeed;

        // Reset when falling out of view
        if (this.y > canvas.height + 50) {
          this.reset(false);
        }
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);
        ctx.globalAlpha = this.opacity;

        if (this.type === 'coin') {
          // --- DRAW GOLD COIN ---
          ctx.beginPath();
          ctx.arc(0, 0, this.size / 2, 0, Math.PI * 2);
          ctx.fillStyle = '#ffd700'; // Gold fill
          ctx.fill();
          ctx.lineWidth = 2;
          ctx.strokeStyle = '#b8860b'; // Dark gold border
          ctx.stroke();

          // Inner rim
          ctx.beginPath();
          ctx.arc(0, 0, this.size / 2.8, 0, Math.PI * 2);
          ctx.strokeStyle = '#daa520';
          ctx.lineWidth = 1;
          ctx.stroke();

          // Dollar sign inside coin
          ctx.fillStyle = '#b8860b';
          ctx.font = `bold ${this.size * 0.5}px sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('$', 0, 1);

        } else {
          // --- DRAW DOLLAR BILL ---
          const w = this.size * 1.6;
          const h = this.size * 0.9;

          // Green background
          ctx.fillStyle = '#85bb65';
          ctx.fillRect(-w / 2, -h / 2, w, h);

          // Dark green border
          ctx.strokeStyle = '#2e5618';
          ctx.lineWidth = 1.5;
          ctx.strokeRect(-w / 2, -h / 2, w, h);

          // Center badge
          ctx.fillStyle = '#e8f5e9';
          ctx.beginPath();
          ctx.ellipse(0, 0, w * 0.25, h * 0.3, 0, 0, Math.PI * 2);
          ctx.fill();

          // Dollar symbol on bill
          ctx.fillStyle = '#2e5618';
          ctx.font = `bold ${h * 0.5}px sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('$', 0, 1);
        }

        ctx.restore();
      }
    }

    // Populate particles
    for (let i = 0; i < particleCount; i++) {
      particles.push(new MoneyParticle());
    }

    // Animation Loop
    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      particles.forEach(p => {
        p.update();
        p.draw();
      });

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
